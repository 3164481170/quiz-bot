<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>对话式答题窗口 - quiz-bot 自测</title>
<style>
  body { margin:0; font-family:"Microsoft YaHei",sans-serif; background:#eef2f7; height:100vh; }
  #app { display:flex; flex-direction:column; height:100vh; max-width:900px; margin:0 auto; background:#fff; }
  .chat-list { flex:1; overflow-y:auto; padding:20px; }
  .msg-row { display:flex; margin-bottom:16px; }
  .msg-row.self { justify-content:flex-end; }
  .msg-row.other { justify-content:flex-start; }
  .bubble { max-width:70%; padding:12px 16px; border-radius:10px; white-space:pre-wrap;
            font-size:14px; line-height:1.65; }
  .msg-row.other .bubble { background:#f2f4f8; color:#222; }
  .msg-row.self .bubble { background:#2f6fed; color:#fff; }
  .chat-input { display:flex; align-items:center; gap:10px; padding:14px 20px; border-top:1px solid #e3e8ef; }
  #editor { flex:1; min-height:24px; max-height:120px; overflow-y:auto; padding:10px 14px;
            border:1px solid #cfd8e3; border-radius:20px; outline:none; font-size:14px; }
  #editor:empty:before { content:attr(data-placeholder); color:#9aa5b1; }
  #sendBtn { padding:9px 22px; border:none; border-radius:20px; background:#2f6fed; color:#fff;
             font-size:14px; cursor:pointer; }
</style>
</head>
<body>
<div id="app">
  <div class="chat-list" id="chatList" role="log">
    <div class="msg-row other"><div class="bubble">你好，我是你的答题助手，下面开始出题。</div></div>
    <div class="msg-row self"><div class="bubble">好的，请出题。</div></div>
    <div class="msg-row other"><div class="bubble">【判断题】(2分)：
Java 中所有的关键字都不能作为标识符使用
A: 正确；B: 错误</div></div>
  </div>
  <div class="chat-input">
    <div id="editor" contenteditable="true" data-placeholder="发送消息"></div>
    <button id="sendBtn" type="button">发送</button>
  </div>
</div>
<script>
  window.SENT = [];
  document.getElementById('sendBtn').addEventListener('click', function () {
    var ed = document.getElementById('editor');
    window.SENT.push(ed.textContent);
    ed.textContent = '';
  });
</script>
</body>
</html>
